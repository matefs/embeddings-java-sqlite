plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.qameta.allure' version '4.1.0'
}

allure {
    version = '2.46.0'
    adapter {
        aspectjWeaver = false
    }
}

group = 'dev.matefs'
version = '0.0.1-SNAPSHOT'
description = 'API de busca semântica com Spring Boot, embeddings locais e SQLite'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'dev.langchain4j:langchain4j-embeddings:0.30.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Executa testes HTTP contra a aplicação Spring Boot real.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
    doFirst {
        project.delete(layout.buildDirectory.dir('allure-results'))
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.named('allureReport') {
    clean.set(true)
}
